defaults:
  - model: qwen2_5_vl_3b
  - generation: precise          # greedy: default per eval riproducibili
  - dataset: egoschema
  - wandb: default
  - _self_

seed: 42

# Root della cache HuggingFace (modelli + datasets). null = lascia il
# default (`$HF_HOME` se già esportata, altrimenti `~/.cache/huggingface`).
# Su HPC override col path della cache condivisa, es.
# `python main.py hf_home=/work/shared/hf`. main.py applica questo
# valore PRIMA di importare transformers, perché `huggingface_hub` legge
# le costanti di cache al momento dell'import.
hf_home: ${oc.env:HF_HOME,null}

# Numero massimo di sample da valutare (null = tutti). Tronca DOPO il
# loader e i filtri dataset-specifici (duration/tasks/...). Pensato per gli
# smoke test (`limit=5`): chiude la pipeline in pochi minuti ma le metriche
# NON sono significative. Lascialo null per i run di prod.
limit: null

# Se true, mischia i sample (RNG seedato con `seed`) PRIMA di applicare
# `limit`. Pensato per le probe di throughput: un subset `limit=N` così è
# RAPPRESENTATIVO dell'intero dataset, mentre i loader restituiscono i
# sample in ordine (mvbench per task, lvbench per video) → i primi N
# sarebbero biased. Irrilevante a `limit=null` (accuracy invariata: ogni
# sample è indipendente). Default false per i run di prod.
shuffle: false

# NB: il debug dell'attenzione entity→token visivi su UN singolo video NON
# vive più qui. È uno script top-level separato e senza Hydra:
#   uv run python debug_attention.py --video videos/paperella.mp4 --entity duck
# Vedi debug_attention.py e utils/attn_probe.py / utils/attn_frames.py.

# Sharding per job array SLURM (run pesanti: lvbench). `num_shards` = numero
# totale di job; `shard` = indice di QUESTO job (0..num_shards-1). Slice
# strided `samples[shard::num_shards]` → ogni shard mescola le fasce di durata
# (lvbench ha video 1-2h molto variabili) bilanciando il walltime fra i job.
# Deterministico (no shuffle in prod) → i shard sono disgiunti e coprono tutto
# il dataset. I risultati si combinano per `wandb.group` a fine array.
# Entrambi null = nessuno sharding (default, singolo job).
shard: null
num_shards: null
