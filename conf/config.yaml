active:
  model: qwen2_5_vl_3b         # (qwen2_5_vl_3b | qwen2_5_vl_3b_attn | qwen3_vl_2b | qwen3_vl_2b_attn | qwen3_vl_4b | qwen3_vl_4b_attn)
  generation: precise          # (precise | balanced | creative)
  dataset: egoschema           # (egoschema | mvbench | video_mme | lvbench | causal2needles)
  wandb: default                # (default)
  strategy: uniform             # (uniform | entropy_shortcut | entropy_attention_resample | attention_highlight | attention_marker | visual_prompt | coarse_to_fine)

model:
  qwen2_5_vl_3b:
    name: qwen25_vl_3b
    torch_dtype: bfloat16        # (float16 | bfloat16 | float32)
    device_map: auto
    min_pixels: null
    max_pixels: 802816
    num_text_layers: null
    num_vision_layers: null
    # false = regime storico (tutte le misure del README): senza video_metadata
    # il processor inventa fps/indici e `second_per_grid_ts` vale 0.083 per
    # QUALUNQUE video → in get_rope_index diventa 0 e le celle video collassano
    # sulla stessa posizione temporale M-RoPE. true = timestamp reali, corretto
    # ma NON confrontabile con i numeri esistenti. Vedi `Qwen._prepare_inputs`.
    pass_video_metadata: false   # (true | false)

  qwen2_5_vl_3b_attn:
    name: qwen25_vl_3b_attn
    torch_dtype: bfloat16        # (float16 | bfloat16 | float32)
    device_map: auto
    min_pixels: null
    max_pixels: 802816
    num_text_layers: null
    num_vision_layers: null
    pass_video_metadata: false   # (true | false) vedi qwen2_5_vl_3b
    attn_implementation:
      text_config: qwen25_attn_capture   # alias storico di qwen_attn_capture
      vision_config: sdpa

  qwen3_vl_2b:
    name: qwen3_vl_2b
    torch_dtype: bfloat16        # (float16 | bfloat16 | float32)
    device_map: auto
    min_pixels: null
    max_pixels: 802816
    num_text_layers: null
    num_vision_layers: null

  # Varianti con cattura dei segnali (SupportsSignals): richieste dalle
  # strategy signal-driven (entropy_shortcut, entropy_attention_resample,
  # attention_highlight). Su Qwen3-VL i video_metadata reali sono sempre
  # passati (il processor ci scrive i timestamp nel prompt) — nessun knob.
  qwen3_vl_2b_attn:
    name: qwen3_vl_2b_attn
    torch_dtype: bfloat16        # (float16 | bfloat16 | float32)
    device_map: auto
    min_pixels: null
    max_pixels: 802816
    num_text_layers: null
    num_vision_layers: null
    attn_implementation:
      text_config: qwen_attn_capture
      vision_config: sdpa

  qwen3_vl_4b:
    name: qwen3_vl_4b
    torch_dtype: bfloat16        # (float16 | bfloat16 | float32)
    device_map: auto
    min_pixels: null
    max_pixels: 802816
    num_text_layers: null
    num_vision_layers: null

  qwen3_vl_4b_attn:
    name: qwen3_vl_4b_attn
    torch_dtype: bfloat16        # (float16 | bfloat16 | float32)
    device_map: auto
    min_pixels: null
    max_pixels: 802816
    num_text_layers: null
    num_vision_layers: null
    attn_implementation:
      text_config: qwen_attn_capture
      vision_config: sdpa

generation:
  precise:
    do_sample: false            # (true | false)
    num_beams: 1
    max_new_tokens: 256
    repetition_penalty: 1.05

  balanced:
    do_sample: true              # (true | false)
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    max_new_tokens: 512
    repetition_penalty: 1.05

  creative:
    do_sample: true              # (true | false)
    temperature: 0.9
    top_p: 0.95
    top_k: 50
    max_new_tokens: 1024
    repetition_penalty: 1.0

dataset:
  egoschema:
    name: egoschema
    root: /work/tesi_avalenza/datasets/egoschema
    nframes: 64
    double_frames: false   # (true | false) frame-doubling: ogni frame passato 2 volte → 1 cella = 1 frame (token visivi ×2). CLI: --double-frames
    max_pixels: 151200

  mvbench:
    name: mvbench
    root: /work/tesi_avalenza/datasets/mvbench
    nframes: 32
    double_frames: false   # (true | false) frame-doubling: ogni frame passato 2 volte → 1 cella = 1 frame (token visivi ×2). CLI: --double-frames
    max_pixels: 151200
    tasks: null      # (null | [action_sequence | action_prediction | action_antonym | fine_grained_action | unexpected_action | object_existence | object_interaction | object_shuffle | moving_direction | action_localization | scene_transition | action_count | moving_count | moving_attribute | state_change | character_order | egocentric_navigation | episodic_reasoning | counterfactual_inference])

  video_mme:
    name: video_mme
    root: /work/tesi_avalenza/datasets/video_mme
    nframes: 128
    double_frames: false   # (true | false) frame-doubling: ogni frame passato 2 volte → 1 cella = 1 frame (token visivi ×2). CLI: --double-frames
    max_pixels: 151200
    duration: all          # (short | medium | long | all)
    use_subtitles: false   # (true | false)

  lvbench:
    name: lvbench
    root: /work/tesi_avalenza/datasets/lvbench
    nframes: 768
    double_frames: false   # (true | false) frame-doubling: ogni frame passato 2 volte → 1 cella = 1 frame (token visivi ×2). CLI: --double-frames
    max_pixels: 50176
    min_pixels: 3136
    use_time_reference: false   # (true | false)

  causal2needles:
    name: causal2needles
    root: /work/tesi_avalenza/datasets/causal2needles
    nframes: 128
    double_frames: false   # (true | false) frame-doubling: ogni frame passato 2 volte → 1 cella = 1 frame (token visivi ×2). CLI: --double-frames
    max_pixels: 151200

strategy:
  uniform:
    name: uniform

  entropy_shortcut:
    name: entropy_shortcut
    capture_attention: false   # opt-in: dump capture.pt/frames per sample per attn_explorer.serve (I/O non trascurabile)

  entropy_attention_resample:
    name: entropy_attention_resample
    entropy_threshold: 0.7
    concentration_threshold: 30.0
    # --- selettore di ramo disperso/concentrato (docs/piano_zoom_multiregione_disgiunto.md §1.3) ---
    branch_selector: concentration  # (concentration | concentration_ratio | entropy) default = comportamento storico, invariato
    attention_entropy_threshold: 0.7  # soglia su H/log(t) se branch_selector=entropy, NON usare: top1_pct batte H_norm (vedi piano)
    concentration_ratio: 3.85  # soglia adattiva (top1_pct < ratio*100/t) se branch_selector=concentration_ratio, calibrata su Video-MME nframes=128 (Stage C)
    window_frac: 0.3
    phase_shift_frac: 0.5
    sink_percentile: 25.0
    sink_border: 0
    capture_attention: false   # opt-in: dump capture.pt/frames SOLO per i sample ricampionati (resampled=true)
    # --- C1: zoom multi-regione disgiunto (docs/piano_zoom_multiregione_disgiunto.md) ---
    zoom_multi_region: false  # master switch, default OFF: sweep esistente invariato
    n_regions: 3              # numero massimo di regioni disgiunte
    region_select: adaptive   # (topk | adaptive) selezione delle celle-picco
    region_mad_k: 2.0         # soglia adattiva = mediana + k*MAD (esclude il picco, vedi §1.2)
    region_merge_gap_frac: 0.05  # fondi celle selezionate a distanza < questa frazione della finestra
    region_window_frac: 0.1     # semi-larghezza di ogni regione (frazione della finestra pass-1)
    budget_allocation: proportional  # (equal | proportional) come spartire budget.nframes fra le regioni
    force_zoom_for_debug: false  # instrada TUTTI i sample ricampionati nel ramo zoom, bypassando concentration_threshold

  # Evidence highlighting (Look Twice, arXiv:2604.01280) invece di resampling:
  # stessi frame del pass 1, cambia solo il prompt. Vedi
  # `strategies/attention_highlight.py` per il razionale e le differenze dal paper.
  attention_highlight:
    name: attention_highlight
    entropy_threshold: 0.7      # stesso gate (e stesso default) di entropy_attention_resample: gli arm devono essere confrontabili
    always_highlight: false     # true = regime LoT (nessun gate, evidenzia sempre); false = confrontabile con gli arm di resampling
    top_k: 3                    # quante celle (istanti) evidenziare, le top-k per massa di attenzione sink-filtrata.
                                # top_k=1 = la stessa cella su cui zooma il ramo zoom_peak di entropy_attention_resample
    cell_select: attention      # (attention | random | antipeak)
                                # random = ARM DI CONTROLLO: celle estratte a sorte invece che dal
                                # picco di attenzione, tutto il resto identico (gate, formato del puntatore, costo).
                                # Serve ad attribuire il guadagno: se il caso rende quanto il picco, l'attenzione non
                                # contribuisce e si sta misurando solo l'effetto del prompt.
                                # antipeak = SONDA DI SENSIBILITÀ (non un arm di accuracy): indica il punto più lontano
                                # dal picco, cioè svia di proposito. Da usare con always_highlight=true e da leggere su
                                # `mcq_accuracy_correct_pass1_true` (accuracy sui sample già corretti al pass 1): se non
                                # scende, il modello sta ignorando il puntatore e il problema non è DOVE si punta.
    random_seed: 0              # seed dell'estrazione, mescolato con (video_path, prompt) → cella stabile per sample,
                                # identica fra shard e fra rilanci. Cambiarlo ripete il controllo con un'altra estrazione.
    pointer_units: seconds      # (seconds | fraction) come il puntatore riferisce il tempo; con `frames` fissati dal dataset è sempre fraction
    pointer_position: prepend   # (prepend | append) puntatore prima della domanda (adiacente al video) o dopo
    sink_percentile: 25.0       # filtro sink identico a entropy_attention_resample (= tau del paper, 25° percentile)
    sink_border: 0
    # (all | qopts | question | entity) SU QUALI righe-query si calcola il picco.
    # `all` = tutto ciò che segue l'ultimo <|vision_end|>: domanda + le quattro
    # opzioni + "Answer with the letter..." + generation prompt. Su un prompt
    # Video-MME tipico sono 86 token di cui 21 di domanda, cioè il 76% delle
    # righe mediate NON è la domanda. `qopts` toglie solo il boilerplate,
    # `question` tiene la sola domanda (utils.attn_core.question_rows).
    # `entity` restringe ancora: il decoder GIÀ caricato estrae il/i soggetto/i
    # della domanda (Qwen.extract_entities, ~32 token per sample) e si mediano
    # solo le loro righe; se l'estrazione non mappa verbatim si degrada a
    # `question` (per-sample: entity_mapped=false). Vedi
    # utils.attn_core.resolve_query_rows.
    # Default `all` perché è il regime di tutti gli arm già misurati: cambiarlo
    # renderebbe non appaiate le celle di controllo esistenti sui 2700.
    # Diagnostica offline dello stesso asse: attn_explorer.diag_query_rows.
    query_rows: all
    capture_attention: false    # opt-in: dump capture.pt/frames SOLO per i sample con gate aperto

  # Marcatori inline attorno ai frame di picco — SOLO Qwen3-VL (variante "B"
  # scartata nel docstring di attention_highlight, qui implementabile perché
  # su Qwen3 il video è già t isole visive separate da testo). Vedi
  # `strategies/attention_marker.py` e docs/piano_marcatori_frame_qwen3.md.
  attention_marker:
    name: attention_marker
    always_highlight: true      # nessun gate: si interviene su tutti i sample
    top_k: 1                    # celle marcate
    cell_select: attention      # (attention | random) random = arm di controllo
    query_rows: question        # (all | qopts | question | entity) NON "all": solo i token della domanda (piano §3)
    sink_filter: false          # attenzione GREZZA, niente filtro sink (piano §3bis)
    random_seed: 0
    capture_attention: false

  # Visual prompting: la parola IMPORTANT DIPINTA sui frame della cella di
  # picco, invece di marcatori testuali attorno al blocco (variante "C").
  # Un solo blocco video: nessuno split, struttura token identica alla
  # baseline. Vedi strategies/visual_prompt.py e docs/piano_visual_prompting.md.
  visual_prompt:
    name: visual_prompt
    always_highlight: true       # nessun gate: si interviene su tutti i sample
    top_k: 1                     # celle dipinte (ENTRAMBI i frame di ognuna)
    cell_select: attention       # (attention | random) random = arm di controllo
    query_rows: entity           # (all | qopts | question | entity) `entity` = sole righe del
                                 # soggetto estratto dal decoder (UNA sequenza verbatim o NONE,
                                 # vedi utils/attn_core.py::resolve_query_rows); sui sample in
                                 # cui non mappa si degrada a `question`, tracciato per sample
                                 # da `query_rows_mode`/`entity_mapped`.
    sink_filter: true            # ⚠️ NON più appaiato con attention_marker (che gira a false,
                                 # su attenzione grezza): un confronto diretto marker↔
                                 # visual_prompt mescolerebbe due cambiamenti. Il confronto
                                 # valido per questo arm resta quello INTERNO,
                                 # cell_select=attention contro random, che condivide tutti
                                 # questi knob. Vedi docs/260901-tabelle-risultati.md §5.
    sink_percentile: 25.0        # conta solo se sink_filter=true
    sink_border: 0
    random_seed: 0
    overlay_position: bottom     # (top | bottom) geometria = knob, la parola no
    overlay_height_frac: 0.12    # altezza banda in frazione dell'altezza frame.
                                 # ⚠️ il gate di leggibilità §8.1 è stato passato a
                                 # top/0.18: bottom/0.12 lascia ~25px di testo dopo il
                                 # downscale del processor (contro ~38px) — sotto 0.10
                                 # su frame piccoli paint_important RIFIUTA di dipingere
                                 # (RuntimeError, il sample fallisce, non degrada in
                                 # silenzio). Ri-verificabile con
                                 # scripts/probe_overlay_legibility.py.
    capture_attention: false     # opt-in: dump capture.pt/frames per attn_explorer

  coarse_to_fine:
    name: coarse_to_fine
    # Zoom iterativo: a ogni passo si ricampionano `nframes` frame DENTRO la
    # regione più promettente del ranking accumulato, finché l'entropia della
    # risposta scende sotto soglia. Vedi strategies/coarse_to_fine.py.
    max_steps: 3                 # forward con cattura al massimo (1 = baseline)
    entropy_threshold: 0.7       # gate: entropia <= soglia → accetta e rispondi
    min_region_sec: 30.0         # sotto questa durata non si scende oltre
    region_select: attention     # (attention | random) random = CONTROLLO appaiato
    random_seed: 0
    query_rows: question         # (all | qopts | question | entity)
    sink_filter: false
    sink_percentile: 25.0        # conta solo se sink_filter=true
    sink_border: 0

wandb:
  default:
    project: ${dataset.name}
    entity: alesvale97-unimore
    mode: online       # (online | offline | disabled)
    tags: []
    name: null
    notes: null
    group: null

seed: 42
hf_home: ${oc.env:HF_HOME,null}
limit: null
shuffle: false        # (true | false)
shard: null
num_shards: null
