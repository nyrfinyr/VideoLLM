# Causal2Needles. `name` è la chiave usata dal dispatch `Dataset.get` in
# `main.py`/`attn_explorer.capture`; `root` è la directory locale prodotta
# da `fetch/prefetch_causal2needles.py` (layout: metadata.jsonl +
# videos/{yms,symon}/<id>.mp4).
#
# A differenza di EgoSchema/MVBench/Video-MME/LVBench è QA a risposta
# APERTA (niente `options`/MCQ): `text_answer` è testo libero, pensato per
# test "needle in a haystack" (1 o 2 needle cause/effetto da localizzare
# nel video). `CausalNeedles.predict_factory` genera testo libero; NON è
# agganciato a `mcq_accuracy` in `main.py` (richiederebbe uno scorer
# open-ended, es. LLM-judge — non presente in questo repo). Uso primario
# oggi: `attn_explorer.capture --dataset causal2needles --video-idx ...`
# per ispezionare l'attenzione su un singolo sample, non l'eval loop Weave.
name: causal2needles
root: /work/tesi_avalenza/datasets/causal2needles
# Numero fisso di frame per video (campionati uniformemente da
# qwen-vl-utils). Movie-recap (YMS/SyMoN): più corti dei full-length di
# LVBench ma comunque long-form; 128 frame come compromesso ragionevole
# in assenza di una distribuzione di durate verificata — abbassa/alza in
# base a quanto emerge nel primo giro di cattura.
nframes: 128
# Budget di pixel per frame post-resize (1 token ogni 28x28 px). A 128
# frame il budget di 24576 token non vincola → risoluzione piena.
max_pixels: 151200
