# EgoSchema. `name` è la chiave usata dal dispatch `Dataset.get` in
# `main.py`; `root` è la directory locale prodotta da
# `fetch/prefetch_egoschema.py` (layout: metadata.jsonl +
# videos/<video_idx>.mp4).
name: egoschema
root: /work/tesi_avalenza/datasets/egoschema
# Numero fisso di frame per video (campionati uniformemente da
# qwen-vl-utils), al posto di un sample-rate fps. Clip da ~3 min → 64
# frame coprono bene (~5.8k token su Qwen2.5-VL a max_pixels=151200,
# ~10-11 GB VRAM).
nframes: 64
# Budget di pixel per frame post-resize (1 token ogni 28x28 px). Clip
# brevi → il budget di 24576 token non è un vincolo, si tiene la
# risoluzione piena: 151200 ≈ 180 token/frame.
max_pixels: 151200
