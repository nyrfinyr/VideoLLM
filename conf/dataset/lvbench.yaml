# LVBench. `name` è la chiave usata dal dispatch `Dataset.get` in
# `main.py`; `root` è la directory locale prodotta da
# `fetch/prefetch_lvbench.py` (layout: metadata.jsonl + videos/<id>.mp4
# + dropped.jsonl per video selezionati ma non estratti dai chunk).
name: lvbench
root: /work/tesi_avalenza/datasets/lvbench
# Setup paper Qwen2.5-VL: ≤768 frame, ≤24576 token video. 768 frame
# campionati uniformemente sull'intera durata (video long-form 1-2h).
nframes: 768
# 64 token/frame → (768/2)*64 = 24576 token, esatto cap del paper
# (1 token = 28x28 px → 64 token = 50176 px). Run più pesante: se va OOM,
# scendi a nframes o abbassa max_pixels (aggiornando min_pixels sotto).
max_pixels: 50176
# qwen-vl-utils impone un floor di 128 token/frame (100352 px) sui video:
# senza abbassare min_pixels, max_pixels=50176 < floor → smart_resize
# asserisce (`max_pixels >= min_pixels`). min_pixels basso (4 token) sblocca
# i 64 token/frame; tanto è max_pixels a vincolare la risoluzione (i frame
# reali sono sempre più grandi). Cfr. docs/probe_throughput.md.
min_pixels: 3136
# Se true, trimma il video a `[video_start, video_end]` letti da
# `time_reference` (GT del segmento rilevante). Default false: è la
# metodologia *ufficiale* di LVBench — il modello deve trovare il
# segmento da solo. true = eval "open-book" / oracle baseline, utile
# per misurare l'upper bound se il modello sapesse già dove guardare.
use_time_reference: false
