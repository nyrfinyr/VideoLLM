# LVBench. `name` è la chiave usata dal dispatch `Dataset.get` in
# `main.py`; `root` è la directory locale prodotta da
# `fetch/prefetch_lvbench.py` (layout: metadata.jsonl + videos/<id>.mp4
# + dropped.jsonl per video selezionati ma non estratti dai chunk).
name: lvbench
root: /work/tesi_avalenza/datasets/lvbench
# Numero fisso di frame per video (campionati uniformemente da
# qwen-vl-utils su tutta la durata), al posto di un sample-rate fps. I
# video sono long-form (1-2h tipici, max 2h20m): si replica il cap del
# paper Qwen2.5-VL (≤768 frame, ≤24576 token video). 768 frame
# massimizzano la copertura temporale; per starci nel budget token va
# abbassata `max_pixels` (sotto) — frame e risoluzione pescano dallo
# stesso budget.
nframes: 768
# Budget di pixel per frame post-resize (1 token ogni 28x28 px). A 768
# frame: 50176 px ≈ 64 token/frame → (768/2)*64 = 24576 token, esatto cap
# del paper (~13-16 GB VRAM su 24 GB; è il run più pesante — se va OOM,
# scendi a nframes=512 o abbassa ancora max_pixels).
max_pixels: 50176
# Se true, trimma il video a `[video_start, video_end]` letti da
# `time_reference` (GT del segmento rilevante). Default false: è la
# metodologia *ufficiale* di LVBench — il modello deve trovare il
# segmento da solo. true = eval "open-book" / oracle baseline, utile
# per misurare l'upper bound se il modello sapesse già dove guardare.
use_time_reference: false
