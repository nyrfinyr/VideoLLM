# Progetto wandb separato così i prefetch run non inquinano la run list
# del progetto di inference.
wandb:
  project: lvbench-prefetch
  entity: alesvale97-unimore
  mode: online
  tags: [prefetch, lvbench]
  name: null
  notes: null
  group: null

# Repo HF che ospita metadata QA + video di LVBench (mirror self-contained
# di lmms-lab; non serve più YouTube/yt-dlp):
#   data/train-00000-of-00001.parquet     — 1549 domande (4-MCQ), schema
#                                            flat: una riga per QA.
#   video_chunks/videos_chunk_001..014.zip — ~61 GB tot, mp4 flat nominati
#                                            esattamente come `video_path`.
hf_repo: lmms-lab/LVBench
# Config del dataset (un solo subset: `default` / split=train).
config: default
split: train

# Numero massimo di *video* da scaricare (null = tutti, 103). Override CLI
# per smoke test, es. `n=3`. NB: limita i video distinti, non le QA — tiene
# tutte le domande dei primi N video. È il knob che controlla il volume di
# download (i video sono grandi, fino a ~2h ciascuno).
n: null

# Restrizione a un sottoinsieme di chunk (`video_chunks/videos_chunk_<idx>.zip`):
#   null  (default, full run): scarica chunks 001..014 in ordine e si ferma
#                              quando tutti i video selezionati sono estratti.
#   [1]   (smoke):             scarica solo il chunk 001, filtra il parquet
#                              ai `video_path` realmente presenti dentro, poi
#                              tronca a `n`. Garantisce un solo chunk di
#                              download e `metadata.jsonl` sempre prodotto.
# Override CLI: `chunks=[1]` o `chunks=[1,2,3]`.
chunks: null

# Se true, mantiene i zip scaricati sotto `<out>/_zips/` dopo l'estrazione
# (utile per re-run o ispezione). Default false: i zip vengono cancellati
# dopo l'estrazione per risparmiare disco (i chunk sono ~3-5 GB ciascuno).
keep_zips: false

# Dump self-contained letto poi da `evals.lvbench.LVBench.loader`.
# Default deriva da `$HOME` per i run locali; su HPC override con
# `out_dir=/work/...` (via `scripts/fetch/hpc/lvbench.sh`).
out_dir: ${oc.env:HOME}/datasets/lvbench

# HF cache root. null = lascia stare `os.environ` (HF userà
# `~/.cache/huggingface`). Su HPC il `.bashrc` esporta HF_HOME=/work/...
# e l'`oc.env` lo raccoglie automaticamente.
hf_home: ${oc.env:HF_HOME,null}
